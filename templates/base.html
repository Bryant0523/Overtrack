<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logotipo.png') }}">

    <title>{{ title if title else "Overtrack" }}</title>

    <style>
        :root {
            --tile-blue: #2b8590;
            --aqua-wash: #6ec2bd;
            --deep-teal: #1d5e65;
            --mint: #60b5b3;
            --navy: #2a405e;
            --soft-white: #f9f8f7;
            --dark-gray: #1d1d1b;
            --muted-gray: #5e6d76;
            --surface: #eef7f8;
            --surface-strong: #d3edee;
        }

        body {
            background: linear-gradient(180deg, var(--soft-white) 0%, var(--surface) 100%);
            color: var(--dark-gray);
        }

        .nav-bg {
            background: linear-gradient(90deg, var(--navy), var(--tile-blue));
        }

        .nav-link,
        .nav-button {
            color: rgba(249, 248, 247, 0.95);
        }

        .nav-link:hover,
        .nav-button:hover {
            background: rgba(110, 194, 189, 0.16);
            color: #ffffff;
        }

        .brand-card {
            background: white;
            border: 1px solid rgba(43, 133, 144, 0.12);
            box-shadow: 0 12px 30px rgba(43, 133, 144, 0.08);
        }

        .brand-panel {
            background: linear-gradient(180deg, rgba(110, 194, 189, 0.14), rgba(43, 133, 144, 0.06));
            border: 1px solid rgba(43, 133, 144, 0.14);
        }

        .brand-button {
            background-color: var(--tile-blue);
            color: white;
        }

        .brand-button:hover {
            background-color: var(--deep-teal);
        }

        .brand-secondary {
            background-color: var(--aqua-wash);
            color: var(--navy);
        }

        .brand-heading {
            color: var(--navy);
        }

        .brand-text-muted {
            color: var(--muted-gray);
        }

        .brand-input {
            border-color: rgba(43, 133, 144, 0.2);
        }

        .brand-table thead {
            background-color: rgba(43, 133, 144, 0.12);
        }

        .brand-table tbody tr:nth-child(even) {
            background-color: rgba(110, 194, 189, 0.06);
        }

        .brand-table th,
        .brand-table td {
            border-color: rgba(43, 133, 144, 0.08);
        }

        .brand-panel {
            background-color: rgba(110, 194, 189, 0.12);
            border: 1px solid rgba(43, 133, 144, 0.12);
        }

        .brand-alert-success {
            background-color: rgba(96, 181, 179, 0.16);
            color: var(--navy);
        }

        .brand-alert-danger {
            background-color: rgba(255, 77, 79, 0.14);
            color: #b91c1c;
        }

        .brand-alert-warning {
            background-color: rgba(237, 137, 54, 0.14);
            color: #92400e;
        }

        .brand-surface {
            background-color: white;
            border: 1px solid rgba(43, 133, 144, 0.12);
            box-shadow: 0 16px 40px rgba(43, 133, 144, 0.08);
        }

        .brand-button-secondary {
            background-color: var(--aqua-wash);
            color: var(--navy);
        }

        .brand-button-secondary:hover {
            background-color: var(--mint);
        }

        .brand-outline {
            border-color: rgba(43, 133, 144, 0.3);
            color: var(--navy);
        }

        .brand-outline:hover {
            background-color: rgba(110, 194, 189, 0.12);
        }

        .brand-surface-soft {
            background-color: rgba(249, 248, 247, 0.9);
        }

        .badge-primary {
            background-color: rgba(110, 194, 189, 0.2);
            color: var(--navy);
        }
    </style>
</head>

<body class="min-h-screen">

    <!-- Navbar -->
    <nav class="sticky top-0 z-50 nav-bg shadow-lg backdrop-blur-lg">

        <div class="max-w-7xl mx-auto px-6">

            <div class="h-16 flex justify-between items-center">

                <div class="flex items-center gap-10">

                    <div class="flex items-center gap-4">
                        <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-[#1d5e65] via-[#2b8590] to-[#60b5b3] flex items-center justify-center shadow-2xl overflow-hidden border border-white/20">
                            <img src="{{ url_for('static', filename='Img/icon.png') }}" alt="Overtrack logo" class="w-10 h-10 object-contain">
                        </div>

                        <div>
                            <h1 class="text-white font-extrabold text-xl tracking-tight">
                                Overtrack
                            </h1>

                            <p class="text-xs brand-text-muted">
                                Control de horarios
                            </p>
                        </div>
                    </div>

                    <div class="hidden md:flex gap-3">

                        <a href="/" class="px-4 py-2 rounded-lg nav-link nav-button transition">
                            Inicio
                        </a>

                        <!-- <a href="/permisos" class="px-4 py-2 rounded-lg nav-link nav-button transition">
                            Permisos
                        </a> -->

                        <a href="/tabla_resultados" class="px-4 py-2 rounded-lg nav-link nav-button transition">
                            Resumen
                        </a>


                        <a href="/config/dashboard" class="px-4 py-2 rounded-lg nav-link nav-button transition">
                            📈 Gráficos
                        </a>

                        <a href="/limpiar" class="px-4 py-2 rounded-lg nav-link nav-button transition">
                            Limpiar
                        </a>
                        <a href="/config/login" class="px-4 py-2 rounded-lg nav-link nav-button transition">
                            ⚙️ Configuraciones
                        </a>
                    </div>

                </div>

                <div class="flex items-center gap-4">

                    <button class="relative text-gray-300 hover:text-white">

                        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">

                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 10-12 0v3.2c0 .5-.2 1-.6 1.4L4 17h5m6 0v1a3 3 0 11-6 0v-1">
                            </path>

                        </svg>

                    </button>

                    <div class="badge-primary px-4 py-2 rounded-full text-sm">
                        Hola, Bienvenido
                    </div>

                </div>

            </div>

        </div>

    </nav>

    <main class="max-w-7xl mx-auto px-6 py-8">
        {% block content %}
        {% endblock %}
    </main>

</body>

</html>
