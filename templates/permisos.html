<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Permiso</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

<form method="POST" class="bg-white p-6 rounded-xl shadow-md w-full max-w-md space-y-4">

    <h2 class="text-xl font-bold text-gray-700">Registrar Permiso</h2>

    <input
        type="text"
        name="nombre"
        placeholder="Nombre del empleado"
        required
        class="w-full border rounded p-2"
    >

    <input
        type="date"
        name="fecha"
        required
        class="w-full border rounded p-2"
    >

    <select name="tipo" required class="w-full border rounded p-2">
        <option value="">Tipo de permiso</option>
        <option value="entrada">Entrada tardía</option>
        <option value="salida">Salida temprana</option>
    </select>

    <input
        type="number"
        name="minutos"
        min="1"
        placeholder="Minutos de permiso"
        required
        class="w-full border rounded p-2"
    >

    <input
        type="text"
        name="motivo"
        placeholder="Motivo (opcional)"
        class="w-full border rounded p-2"
    >

    <button
        type="submit"
        class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700"
    >
        Guardar permiso
    </button>

</form>

</body>
</html>
