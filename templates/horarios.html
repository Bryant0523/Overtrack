{% extends "base.html" %}
{% block content %}

<div class="w-full px-8 mx-auto brand-card my-5 rounded-3xl p-6">

    <h2 class="text-2xl font-bold mb-4 brand-heading">Horarios de las sedes</h2>

    <div class="grid grid-cols-1 p-4 md:grid-cols-3 gap-6">

        {% for sede, horario in horarios.items() %}
        <div class="p-5 rounded-3xl shadow hover:shadow-xl transition cursor-pointer border border-[#d3edee] bg-[#f9f8f7]">
            <h3 class="text-xl font-semibold mb-3 text-[#2b8590]">{{ sede.capitalize() }}</h3>
            <div class="space-y-2 text-[#5e6d76]">
                {% for dia, horas in horario.items() %}
                <p><span class="font-semibold">{{ dia }}:</span> {{ horas.entrada }} – {{ horas.salida }}</p>
                {% endfor %}
            </div>
        </div>
        {% endfor %}

    </div>
</div>

{% endblock %}
